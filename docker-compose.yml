services:
  node-to-proxy:
    build: .
    image: node-to-proxy:latest
    container_name: node-to-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"    # Web 控制台 / API
      - "18999:18999"  # HTTP 代理出口
      - "18998:18998"  # SOCKS5 代理出口
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - BIND_HOST=0.0.0.0
      - WEB_PORT=8080
      - HTTP_PROXY_PORT=18999
      - SOCKS5_PROXY_PORT=18998
      - HEALTH_INTERVAL_MS=30000
      - HEALTH_TIMEOUT_MS=3000
    volumes:
      - ./data:/data